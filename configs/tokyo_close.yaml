# Alternative snapshot convention: Tokyo 15:00 JST. JGB is same-day and mandatory; NY-close
# quantities (FX, UST) are taken as-of the previous NY close. Everything else as default.yaml.
project:
  name: usdjpy_mr
  start_date: "2010-01-01"
  end_date: null
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  reports_dir: reports
  signals_dir: signals
sources:
  fred:
    api_key_env: FRED_API_KEY
    csv_url_template: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}"
    series: {us2y: DGS2, us10y: DGS10, us10y_real: DFII10}
    snapshot_note: "US Treasury CMT yields, 15:30 ET (NY close)"
  mof:
    all_history_url: "https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/historical/jgbcme_all.csv"
    current_year_url: "https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/jgbcme.csv"
    encoding_candidates: ["utf-8", "cp932", "latin-1"]
    tenors: {jgb2y: "2Y", jgb10y: "10Y"}
    snapshot_note: "JGB benchmark yields, JSDA reference, ~15:00 JST (Tokyo close)"
  fx:
    provider: yahoo
    yahoo_ticker: "USDJPY=X"
    yahoo_field: Close
    snapshot_note: "Yahoo daily bar close; approximates NY 17:00 ET close. IBKR is the production source."
  ibkr:
    host_env: IBKR_HOST
    port_env: IBKR_PORT
    client_id_env: IBKR_CLIENT_ID
    spot: {symbol: USD, currency: JPY, exchange: IDEALPRO, what_to_show: MIDPOINT}
    futures: {symbol: JPY, exchange: CME}
    bar_size: "1 day"
    use_rth: false
    live_account_confirmed: false
alignment:
  convention: tokyo_close
  drop_if_missing: [jgb2y, jgb10y]
  asof_max_lag_days: {usdjpy: 5, us2y: 5, us10y: 5, us10y_real: 5}
  weekmask: "Mon Tue Wed Thu Fri"
  publication_lag_days: 3          # gaps this close to end_date are 'not yet published', not errors
validation:
  bounds:
    usdjpy: [70.0, 200.0]
    us2y: [-1.0, 20.0]
    us10y: [-1.0, 20.0]
    us10y_real: [-3.0, 10.0]
    jgb2y: [-1.0, 10.0]
    jgb10y: [-1.0, 10.0]
  max_gap_business_days: 5
  min_rows: 2500
  required_start_before: "2010-01-15"
  max_days_stale_end: 10

stats:
  # Phase 2: statistical confirmation. Specifications = tenor x yield_type x sample.
  specs:
    - {tenor: 10y, yield_type: nominal}
    - {tenor: 2y, yield_type: nominal}
    - {tenor: 10y, yield_type: real}     # US real (DFII10) minus nominal JGB; no JGB real yield source
  samples:
    full: {start: null, end: null}
    post_2016: {start: "2016-01-01", end: null}
    post_2022: {start: "2022-01-01", end: null}
  significance: 0.05
  adf: {regression: c, autolag: AIC}
  kpss: {regression: c, nlags: auto}
  engle_granger: {trend: c, autolag: aic, max_lag: null}
  johansen: {det_order: 0, k_ar_diff: 1}
  rolling_ols_windows: [250, 500, 750]
  kalman:
    delta: 1.0e-5              # state noise ratio; Q = delta/(1-delta) * I
    obs_var: null              # null = estimate from static OLS residual variance
    init_from_first_n: 250     # initialise state/covariance from OLS on the first n obs
  ou:
    n_boot: 1000
    ci: 0.95
    seed: 7
  half_life_bounds: [5, 50]    # tradeable band, in bars
  breaks:
    known_dates:               # policy events from the handoff, tested with Chow
      - {date: "2022-09-22", label: "MoF intervention"}
      - {date: "2022-12-20", label: "BoJ YCC tweak"}
      - {date: "2023-07-28", label: "BoJ YCC change"}
      - {date: "2023-10-31", label: "BoJ YCC change"}
      - {date: "2024-03-19", label: "BoJ NIRP exit"}
      - {date: "2024-04-29", label: "MoF intervention"}
      - {date: "2024-07-31", label: "BoJ hike / carry unwind"}
    trim: 0.15                 # sup-F trimming fraction at each end
    max_breaks: 3
    n_boot: 500
    seed: 11
    recent_months: 24          # 'no unexplained break in the last 24 months' acceptance clause
    tolerance_days: 45         # a found break within this distance of a known date is 'explained'
  rolling_coint: {window: 500, step: 5}
  anchors:                     # sanity check on the residual sign (handoff §1 / §5.7)
    - {start: "2023-01-01", end: "2023-01-31", expected_sign: negative}
    - {start: "2024-07-01", end: "2024-07-15", expected_sign: positive}
  zscore_window: 60
