[project]
name = "usdjpy-mr"
version = "0.1.0"
description = "USD/JPY vs US-Japan yield spread: cointegration mean-reversion signal engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Andrea Pagani" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fredapi>=0.5",
    "yfinance>=0.2.40",
    "ib-async>=1.0",
    "holidays>=0.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0; sys_platform == 'win32'"]
notebook = ["matplotlib>=3.8", "ipykernel>=6.29"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usdjpy_mr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]  # exploratory only

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PD"]
ignore = ["PD010"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
